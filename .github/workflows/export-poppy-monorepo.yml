name: Export Poppy monorepo source

on:
  push:
    branches: [poppy-monorepo-export]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message || '', '[poppy-export-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bundle tracked source into reviewable chunks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const outDir = '__migration/poppy-export';
          fs.rmSync(outDir, { recursive: true, force: true });
          fs.mkdirSync(outDir, { recursive: true });
          const raw = cp.execSync('git ls-files -s -z', { encoding: 'utf8' });
          const records = raw.split('\0').filter(Boolean);
          const files = [];
          const excluded = [];
          for (const record of records) {
            const m = record.match(/^(\d+) [0-9a-f]+ \d+\t(.+)$/s);
            if (!m) continue;
            const mode = m[1];
            const file = m[2];
            const isSecretEnv = file === '.env' || (/^\.env\./.test(file) && file !== '.env.example');
            const isExporter = file === '.github/workflows/export-poppy-monorepo.yml';
            const isGenerated = file.startsWith('__migration/poppy-export/');
            if (isSecretEnv || isExporter || isGenerated) { excluded.push(file); continue; }
            files.push({ path: file, mode, content: fs.readFileSync(file).toString('base64') });
          }
          const maxBytes = 190000;
          const packs = [];
          let current = [], currentBytes = 2;
          for (const entry of files) {
            const encoded = JSON.stringify(entry);
            if (current.length && currentBytes + Buffer.byteLength(encoded) + 1 > maxBytes) { packs.push(current); current = []; currentBytes = 2; }
            current.push(entry); currentBytes += Buffer.byteLength(encoded) + 1;
          }
          if (current.length) packs.push(current);
          packs.forEach((pack, index) => fs.writeFileSync(path.join(outDir, `pack-${String(index + 1).padStart(3, '0')}.json`), JSON.stringify(pack)));
          let sourceCommit = process.env.GITHUB_SHA || '';
          try { sourceCommit = cp.execSync('git rev-parse HEAD^', { encoding: 'utf8' }).trim(); } catch {}
          fs.writeFileSync(path.join(outDir, 'manifest.json'), JSON.stringify({ sourceRepo: process.env.GITHUB_REPOSITORY, sourceCommit, exportedAt: new Date().toISOString(), fileCount: files.length, packCount: packs.length, excluded, note: 'Tracked repository snapshot. Real .env secrets and temporary exporter files are intentionally excluded.' }, null, 2));
          console.log(`Exported ${files.length} tracked files into ${packs.length} packs.`);
          NODE
      - name: Commit export packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __migration/poppy-export
          git commit -m "[poppy-export-generated] bundle source for monorepo" || exit 0
          git push
