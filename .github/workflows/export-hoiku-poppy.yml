name: Export source for Hoiku Poppy

on:
  push:
    branches:
      - chore/export-to-hoiku-poppy

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -qr source.zip . \
            -x '.git/*' \
            -x '.github/workflows/export-hoiku-poppy.yml' \
            -x 'source.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hoikufinance-source
          path: source.zip
          if-no-files-found: error
          retention-days: 1
